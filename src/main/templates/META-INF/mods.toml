modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayTest="IGNORE_ALL_VERSION"
description='''
A direct character and equipment screen with changed attributes, body-region equipment selection, and optional Curios integration.
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[${forge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
mandatory=false
versionRange="${curios_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="needs_not_necessities"
mandatory=false
versionRange="[1.1,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="puffish_skills"
mandatory=false
versionRange="${puffish_skills_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="armordamagescale"
mandatory=false
versionRange="${armor_damage_scaling_version_range}"
ordering="AFTER"
side="BOTH"
